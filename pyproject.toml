[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-mac-battery-fix"
version = "1.0.0"
description = "Safe macOS battery, CPU, memory, and token-efficiency fix for Google Antigravity IDE (v2.6.0+)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
py-modules = ["antigravity_battery_fix"]

[project.urls]
Homepage = "https://github.com/focusjordan/Antigravity-MacOS-Battery-Fix"
Repository = "https://github.com/focusjordan/Antigravity-MacOS-Battery-Fix"

[project.scripts]
antigravity-battery-fix = "antigravity_battery_fix:main"

